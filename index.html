<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Australian Traffic Enforcement Dashboard</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>    
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">Traffic Enforcement Dashboard</div>
    </header>

    <main class="app-container">

        <section id="dashboard-view" class="view-section" >
            
            <div class="filter-panel">
                <h2>Dashboard Controls</h2>
                <div class="filters-grid">
                    <div class="control-group">
                        <label for="filter-jurisdiction">State / Jurisdiction:</label>
                        <select id="filter-jurisdiction">
                            <option value="all">All States / Territories</option>
                        </select>
                    </div>

                    <div class="control-group">
                        <label for="filter-location">Geographic Location:</label>
                        <select id="filter-location">
                            <option value="all">All Geographic Regions</option>
                        </select>
                    </div>

                    <div class="control-group">
                        <label for="filter-metric">Offence Metric:</label>
                        <select id="filter-metric">
                            <option value="all">All Offence Categories</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="kpi-container">
                <div class="kpi-card">
                    <span class="kpi-title">Total Compiled Fines</span>
                    <span class="kpi-value" id="kpi-fines">0</span>
                </div>
                <div class="kpi-card">
                    <span class="kpi-title">Recorded Arrests</span>
                    <span class="kpi-value" id="kpi-arrests">0</span>
                </div>
                <div class="kpi-card">
                    <span class="kpi-title">Formal Charges Filed</span>
                    <span class="kpi-value" id="kpi-charges">0</span>
                </div>
            </div>

            <div class="visuals-grid">
                <div class="chart-wrapper">
                    <h3>Offence Violation Breakdown</h3>
                    <div id="chartViolations"></div>
                </div>
                <div class="chart-wrapper">
                    <h3>Enforcement Outcome Comparison</h3>
                    <div id="chartOutcomes"></div>
                </div>
            </div>

            <div class="table-wrapper">
                <h3>Filtered Data Records</h3>
                <p class="table-note" id="table-summary">Showing 0 records.</p>
                <div class="table-scroll">
                    <table id="summaryTable">
                        <thead>
                            <tr>
                                <th>Year</th>
                                <th>Jurisdiction</th>
                                <th>Region</th>
                                <th>Age Group</th>
                                <th>Offence Type</th>
                                <th>Fines Issued</th>
                                <th>Arrests</th>
                                <th>Charges</th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                            </tbody>
                    </table>
                </div>
            </div>

        </section>
    </main>

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="js/d3.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
